<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="aset/logo1.png" />
    <title>Napza Edu Card</title>
    <style>
      body {
        background: #222;
        color: #fff;
        font-family: "Segoe UI", Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
      }
      .container {
        background: #333;
        padding: 40px 30px;
        border-radius: 12px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
        text-align: center;
      }
      h1 {
        font-size: 2.2rem;
        margin-bottom: 16px;
      }
      p {
        font-size: 1.1rem;
        margin-bottom: 32px;
      }
      .btn-back {
        background: #ff9800;
        color: #fff;
        border: none;
        padding: 12px 32px;
        border-radius: 6px;
        font-size: 1rem;
        cursor: pointer;
        transition: background 0.2s;
        text-decoration: none;
        display: inline-block;
      }
      .btn-back:hover {
        background: #e68900;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Situs Sedang Maintenance</h1>
      <p>
        Maaf, saat ini situs sedang dalam proses pemeliharaan untuk peningkatan
        website.<br />
        Silakan kembali lagi nanti.
      </p>
      <a href="javascript:history.back()" class="btn-back">Kembali</a>
    </div>
  </body>
</html>
